<script>
// ---------- CONFIG ----------
// Paste your Apps Script Web App URL (ends in /exec) and TOKEN here to enable
// fast reads + write-back. Leave blank to use read-only public-sheet fallback.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzEN5iD09_e1u2RQSq9QAy8XLYvtnhugU6SPEhReVQHKJUx192mwWSSNxKtJj8OgpNH/exec';
const WRITE_TOKEN = 'ff64Gl2JvPYtotkkqLyOlmVk9Tsg1oqM6d71U4q1';

const SHEET_ID = '1G09-JKOTXbV6l-fK0TCjnIjEMr7bq-iuAiiQ_3Hgv-s';
const SHEET_REFRESH_MS = 1000;
const TAB_REFRESH_MS = 20000;

// ---------- STATE ----------
let sheets = [];
let activeGid = null;
let activeWorkoutIdx = 0;
let workouts = [];
let lastSig = null;
let isEditing = false;     // pause re-render while a cell is focused

const HAS_BACKEND = !!APPS_SCRIPT_URL;
const CAN_EDIT = HAS_BACKEND && !!WRITE_TOKEN;

// ---------- DISCOVERY: list of sheets ----------
async function fetchSheetList() {
  if (HAS_BACKEND) {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=list&_=${Date.now()}`, { cache: 'no-store' });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return data.sheets;
  }
  // Fallback: pair xlsx names with htmlview gids in tab order
  const stamp = Date.now();
  const [xlsxRes, htmlRes] = await Promise.all([
    fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=xlsx&_=${stamp}`, { cache: 'no-store' }),
    fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/htmlview?_=${stamp}`, { cache: 'no-store' }),
  ]);
  if (!xlsxRes.ok || !htmlRes.ok) throw new Error('discovery fetch failed');
  const buf = await xlsxRes.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);
  const xml = await zip.file('xl/workbook.xml').async('string');
  const names = [];
  const re = /<sheet [^/]*name="([^"]+)"/g;
  let m;
  while ((m = re.exec(xml))) names.push(m[1].trim());
  const html = await htmlRes.text();
  const seen = new Set();
  const gids = [];
  for (const match of html.matchAll(/gid=(\d+)/g)) {
    const g = match[1];
    if (!seen.has(g)) { seen.add(g); gids.push(g); }
  }
  const n = Math.min(names.length, gids.length);
  const out = [];
  for (let i = 0; i < n; i++) out.push({ name: names[i], gid: gids[i] });
  return out;
}

// ---------- DATA: fetch one sheet's rows ----------
async function fetchSheetRows(gid) {
  if (HAS_BACKEND) {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=data&gid=${gid}&_=${Date.now()}`, { cache: 'no-store' });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return { rows: data.rows.map(r => r.map(c => String(c == null ? '' : c).trim())), sig: data.sig };
  }
  // Fallback: gviz
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${gid}&_=${Date.now()}`;
  const res = await fetch(url, { cache: 'no-store' });
  const text = await res.text();
  const match = text.match(/setResponse\(([\s\S]*)\);?\s*$/);
  if (!match) throw new Error('Bad gviz response');
  const data = JSON.parse(match[1]);
  const rows = [];
  for (const r of (data.table.rows || [])) {
    const cells = (r.c || []).map(c => {
      if (!c) return '';
      const v = c.f != null ? c.f : (c.v != null ? c.v : '');
      return String(v).trim();
    });
    rows.push(cells);
  }
  return { rows, sig: data.sig || String(rows.flat().join('|').length) };
}

// ---------- WRITE: post a single cell change ----------
async function saveCell(gid, sheetRow, sheetCol, value) {
  if (!CAN_EDIT) return { ok: false, error: 'editing not configured' };
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ gid, row: sheetRow, col: sheetCol, value, token: WRITE_TOKEN }),
      cache: 'no-store',
    });
    const data = await res.json();
    if (data.error) return { ok: false, error: data.error };
    return { ok: true };
  } catch (e) {
    return { ok: false, error: String(e) };
  }
}

// ---------- PARSE: workouts from rows (preserves original sheet row index) ----------
const DATE_RE = /^\d{1,2}\/\d{1,2}(\/\d{2,4})?$/;
const DAY_RE = /^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\b/i;
const SECTION_RE = /^(WARM[-\s]?UP|STRENGTH BLOCK|CONDITIONING|MOBILITY|COOL[-\s]?DOWN|CORE|ACCESSORY|MAIN|SECONDARY)\b/i;
const FINISHER_RE = /^FINISHER\b/i;

function parseWorkouts(rows) {
  const workouts = [];
  let cur = null;
  function commitSection(w) { if (w._section) { w.sections.push(w._section); w._section = null; } }
  function commit() { if (cur) { commitSection(cur); workouts.push(cur); cur = null; } }

  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const sheetRow = i + 1;             // 1-indexed sheet row
    const a = (row[0] || '').trim();
    if (!a && row.every(c => !c)) continue;

    if (DATE_RE.test(a)) {
      commit();
      cur = { date: a, dateRow: sheetRow, day: '', dayRow: null, sections: [], _section: null };
      continue;
    }
    if (!cur) cur = { date: '', dateRow: null, day: '', dayRow: null, sections: [], _section: null };

    if (!cur.day && (DAY_RE.test(a) || a.includes('—') || a.includes('–'))) {
      cur.day = a;
      cur.dayRow = sheetRow;
      continue;
    }

    if (FINISHER_RE.test(a)) {
      commitSection(cur);
      const text = a.replace(/^FINISHER\s*[:\-—]?\s*/i, '').trim();
      cur._section = { type: 'finisher', title: 'Finisher', body: text, bodyRow: sheetRow, raw: a };
      commitSection(cur);
      continue;
    }

    if (SECTION_RE.test(a) || (a === a.toUpperCase() && a.length > 3 && row.slice(1).every(c => !c))) {
      commitSection(cur);
      const m = a.match(/^([A-Z][A-Z\s\-]+?)(?:\s*[—–\-]\s*(.+))?$/);
      const title = (m && m[1] ? m[1] : a).trim();
      const subtitle = (m && m[2] ? m[2] : '').trim();
      cur._section = {
        type: SECTION_RE.test(a) && /STRENGTH|MAIN|ACCESSORY|SECONDARY/i.test(title) ? 'strength' : 'list',
        title, subtitle, bannerRow: sheetRow, raw: a,
        clients: null, clientsRow: null, rows: [],
      };
      continue;
    }

    if (!cur._section) {
      cur._section = { type: 'list', title: '', subtitle: '', bannerRow: null, clients: null, clientsRow: null, rows: [] };
    }
    const sec = cur._section;
    if (sec.type === 'strength' && sec.clients == null && !a && row.slice(1).some(c => c)) {
      sec.clients = row.slice(1).map(c => c.trim());
      sec.clientsRow = sheetRow;
      continue;
    }
    sec.rows.push({ name: a, notes: row.slice(1).map(c => (c || '').trim()), sheetRow });
  }
  commit();
  return workouts.filter(w => w.sections.length || w.day || w.date);
}

// ---------- RENDER ----------
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

// Make a span editable. opts = {row, col, placeholder}
function makeEditable(span, opts) {
  if (!CAN_EDIT) return span;
  span.classList.add('editable');
  span.setAttribute('contenteditable', 'true');
  span.spellcheck = false;
  let original = span.textContent;
  span.addEventListener('focus', () => { isEditing = true; original = span.textContent; });
  span.addEventListener('blur', async () => {
    isEditing = false;
    const newVal = span.textContent.trim();
    if (newVal === original.trim()) return;
    span.classList.add('saving');
    const res = await saveCell(activeGid, opts.row, opts.col, newVal);
    span.classList.remove('saving');
    if (!res.ok) {
      span.classList.add('save-error');
      console.error('save failed', res.error);
      setTimeout(() => span.classList.remove('save-error'), 2500);
      span.textContent = original;
    } else {
      // success — let the next poll confirm
      original = newVal;
    }
  });
  span.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); span.blur(); }
    else if (e.key === 'Escape') { e.preventDefault(); span.textContent = original; span.blur(); }
  });
  return span;
}

function renderSheetNav() {
  const nav = document.getElementById('sheet-nav');
  nav.innerHTML = '';
  sheets.forEach(s => {
    const btn = el('button',
      'shrink-0 pb-3 pt-1 text-xs eyebrow tab-underline transition ' +
      (s.gid === activeGid ? 'text-teal active' : 'text-muted hover:text-ink'),
      s.name
    );
    btn.onclick = () => {
      if (activeGid === s.gid) return;
      activeGid = s.gid;
      activeWorkoutIdx = 0;
      lastSig = null;
      workouts = [];
      render();
      tickData();
    };
    nav.appendChild(btn);
  });
}

function renderDateNav() {
  const nav = document.getElementById('date-nav');
  nav.innerHTML = '';
  if (workouts.length <= 1) return;
  workouts.forEach((w, i) => {
    const btn = el('button',
      'shrink-0 px-4 py-2 rounded-full border text-xs eyebrow transition ' +
      (i === activeWorkoutIdx
        ? 'bg-teal text-white border-teal'
        : 'bg-white text-muted border-line hover:text-teal hover:border-teal'),
      w.date || '—'
    );
    btn.onclick = () => { activeWorkoutIdx = i; render(); };
    nav.appendChild(btn);
  });
}

function renderSectionHeader(title, subtitle, bannerRow) {
  const wrap = el('div', 'mb-5');
  const titleEl = el('div', 'eyebrow text-teal mb-1', title);
  if (bannerRow) makeEditable(titleEl, { row: bannerRow, col: 1 });
  wrap.appendChild(titleEl);
  if (subtitle) wrap.appendChild(el('div', 'text-muted text-xs font-light tracking-wide', subtitle));
  return wrap;
}

function renderListSection(sec) {
  const wrap = el('section', 'mb-10 card p-7');
  if (sec.title) wrap.appendChild(renderSectionHeader(sec.title + (sec.subtitle ? ' — ' + sec.subtitle : ''), '', sec.bannerRow));
  const list = el('ul', 'border-t hairline');
  sec.rows.forEach((r, idx) => {
    const li = el('li', 'flex items-baseline gap-4 py-3.5 ' + (idx < sec.rows.length - 1 ? 'border-b hairline' : ''));
    li.appendChild(el('span', 'text-teal text-xs', '◆'));
    const nameEl = el('span', 'display text-xl md:text-2xl text-ink leading-snug flex-1', r.name);
    makeEditable(nameEl, { row: r.sheetRow, col: 1 });
    li.appendChild(nameEl);
    list.appendChild(li);
  });
  wrap.appendChild(list);
  return wrap;
}

function renderStrengthSection(sec) {
  const wrap = el('section', 'mb-10 card p-7');
  wrap.appendChild(renderSectionHeader(sec.title + (sec.subtitle ? ' — ' + sec.subtitle : ''), '', sec.bannerRow));

  const clients = sec.clients || [];
  const grid = el('div', 'border-t hairline');
  const colCount = Math.max(clients.length, 1);

  if (clients.length) {
    const head = el('div', 'grid items-end gap-6 py-4 border-b hairline');
    head.style.gridTemplateColumns = `minmax(200px, 1.4fr) repeat(${colCount}, minmax(130px, 1fr))`;
    head.appendChild(el('div', 'eyebrow text-muted', 'Movement'));
    clients.forEach((c, ci) => {
      const cell = el('div', 'eyebrow text-ink', c);
      makeEditable(cell, { row: sec.clientsRow, col: ci + 2 });
      head.appendChild(cell);
    });
    grid.appendChild(head);
  }

  sec.rows.forEach((r, idx) => {
    const row = el('div', 'grid items-baseline gap-6 py-4 ' + (idx < sec.rows.length - 1 ? 'border-b hairline' : ''));
    row.style.gridTemplateColumns = `minmax(200px, 1.4fr) repeat(${colCount}, minmax(130px, 1fr))`;
    const nameEl = el('div', 'display text-xl md:text-2xl text-ink leading-snug', r.name);
    makeEditable(nameEl, { row: r.sheetRow, col: 1 });
    row.appendChild(nameEl);
    for (let i = 0; i < colCount; i++) {
      const note = (r.notes[i] || '').trim();
      const cell = el('div', 'text-coal text-sm font-light leading-snug whitespace-pre-line min-h-[1.25rem]');
      cell.textContent = note || '';
      makeEditable(cell, { row: r.sheetRow, col: i + 2 });
      row.appendChild(cell);
    }
    grid.appendChild(row);
  });

  wrap.appendChild(grid);
  return wrap;
}

function renderFinisher(sec) {
  const wrap = el('section', 'mt-10 mb-8 rounded-2xl border border-teal/30 bg-tealTint p-8 text-center');
  wrap.appendChild(el('div', 'eyebrow text-teal mb-3', 'Finisher'));
  const body = el('div', 'display text-2xl md:text-3xl text-tealDeep leading-snug', sec.body || '');
  if (sec.bodyRow) makeEditable(body, { row: sec.bodyRow, col: 1 });
  wrap.appendChild(body);
  return wrap;
}

function render() {
  if (isEditing) return;        // never blow away an in-progress edit
  renderSheetNav();
  renderDateNav();
  document.getElementById('edit-badge').classList.toggle('hidden', !CAN_EDIT);

  const root = document.getElementById('content');
  root.innerHTML = '';
  root.classList.remove('fade-in'); void root.offsetWidth; root.classList.add('fade-in');

  if (!activeGid && activeGid !== '0') {
    root.appendChild(el('div', 'text-muted py-16 text-center text-sm', 'Loading sessions…'));
    return;
  }

  const w = workouts[activeWorkoutIdx];
  if (!w) {
    root.appendChild(el('div', 'text-muted py-16 text-center text-sm', 'Loading workout…'));
    return;
  }

  const activeSheet = sheets.find(s => s.gid === activeGid);
  const title = el('div', 'mb-10');
  if (w.day) {
    const dayEl = el('div', 'eyebrow text-teal mb-2', w.day);
    if (w.dayRow) makeEditable(dayEl, { row: w.dayRow, col: 1 });
    title.appendChild(dayEl);
  }
  const dateEl = el('h1', 'display text-5xl md:text-6xl text-ink leading-none tnum', w.date || (activeSheet ? activeSheet.name : ''));
  if (w.dateRow) makeEditable(dateEl, { row: w.dateRow, col: 1 });
  title.appendChild(dateEl);
  root.appendChild(title);

  w.sections.forEach(sec => {
    if (sec.type === 'finisher') root.appendChild(renderFinisher(sec));
    else if (sec.type === 'strength') root.appendChild(renderStrengthSection(sec));
    else root.appendChild(renderListSection(sec));
  });

  document.getElementById('last-updated').textContent =
    'Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

// ---------- TICKS ----------
async function tickData() {
  if (activeGid == null) return;
  if (isEditing) return;
  try {
    const { rows, sig } = await fetchSheetRows(activeGid);
    if (sig !== lastSig) {
      lastSig = sig;
      workouts = parseWorkouts(rows);
      if (activeWorkoutIdx >= workouts.length) activeWorkoutIdx = 0;
      render();
    }
    document.getElementById('status').textContent = 'Live';
  } catch (e) {
    console.error('tickData', e);
    document.getElementById('status').textContent = 'Reconnecting';
  }
}

async function tickTabs() {
  try {
    const list = await fetchSheetList();
    const changed = JSON.stringify(list) !== JSON.stringify(sheets);
    sheets = list;
    const stillThere = sheets.some(s => s.gid === activeGid);
    if (!stillThere) {
      activeGid = sheets[0] ? sheets[0].gid : null;
      activeWorkoutIdx = 0;
      lastSig = null;
      workouts = [];
    }
    if (changed && !isEditing) render();
  } catch (e) {
    console.error('tickTabs', e);
  }
}

(async () => {
  await tickTabs();
  await tickData();
  setInterval(tickData, SHEET_REFRESH_MS);
  setInterval(tickTabs, TAB_REFRESH_MS);
})();
</script>
