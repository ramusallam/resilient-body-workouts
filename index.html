<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resilient Body — Workout</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', '"Helvetica Neue"', 'Helvetica', 'Arial', 'sans-serif'],
          serif: ['"Cormorant Garamond"', 'Kepler', 'Georgia', 'serif'],
        },
        colors: {
          ink: '#0a0a0a',
          coal: '#1a1a1a',
          char: '#2a2a2a',
          line: '#e6e6e6',
          muted: '#6b6b6b',
          paper: '#ffffff',
          teal: '#218496',
          tealSoft: '#2aa0b4',
        },
      },
    },
  };
</script>
<style>
  html, body { background: #ffffff; color: #0a0a0a; }
  body { font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 300; -webkit-font-smoothing: antialiased; }
  .display { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; letter-spacing: -0.005em; }
  .eyebrow { letter-spacing: 0.34em; text-transform: uppercase; font-weight: 400; font-size: 0.68rem; }
  .hairline { border-color: #e6e6e6; }
  .scroll-x { scrollbar-width: none; }
  .scroll-x::-webkit-scrollbar { display: none; }
  .live-dot {
    width: 7px; height: 7px; border-radius: 999px; background: #218496;
    box-shadow: 0 0 0 0 rgba(33, 132, 150, 0.6); animation: pulse 2.4s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(33, 132, 150, 0.55); }
    70% { box-shadow: 0 0 0 9px rgba(33, 132, 150, 0); }
    100% { box-shadow: 0 0 0 0 rgba(33, 132, 150, 0); }
  }
  .fade-in { animation: fade 0.35s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body class="min-h-screen">

<div id="app" class="max-w-[1400px] mx-auto px-8 lg:px-14 py-10">
  <!-- Header -->
  <header class="flex items-center justify-between mb-12">
    <div class="flex items-center gap-3">
      <div class="w-1.5 h-1.5 rounded-full bg-ink"></div>
      <div class="eyebrow text-ink">Resilient Body</div>
    </div>
    <div class="flex items-center gap-3 text-muted text-xs">
      <span class="live-dot"></span>
      <span class="eyebrow" id="status">Live</span>
    </div>
  </header>

  <!-- Date pills -->
  <nav id="date-nav" class="flex gap-2 overflow-x-auto scroll-x mb-6 pb-1"></nav>

  <!-- Session tabs -->
  <nav id="session-nav" class="flex gap-2 overflow-x-auto scroll-x mb-10 pb-1"></nav>

  <!-- Main content -->
  <main id="content" class="fade-in"></main>

  <!-- Footer -->
  <footer class="mt-24 pt-8 border-t hairline flex items-center justify-between text-muted text-xs">
    <span class="eyebrow">Resilient Body · 2025</span>
    <span id="last-updated"></span>
  </footer>
</div>

<script>
const SHEET_ID = '1G09-JKOTXbV6l-fK0TCjnIjEMr7bq-iuAiiQ_3Hgv-s';
const REFRESH_MS = 5000;

let activeIndex = 0;
let activeSession = null;
let workouts = [];
let lastSig = null;

async function fetchSheet() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&_=${Date.now()}`;
  const res = await fetch(url);
  const text = await res.text();
  const match = text.match(/setResponse\(([\s\S]*)\);?\s*$/);
  if (!match) throw new Error('Bad gviz response');
  return JSON.parse(match[1]);
}

function rowsFromData(data) {
  const out = [];
  for (const r of (data.table.rows || [])) {
    const cells = (r.c || []).map(c => {
      if (!c) return '';
      const v = c.f != null ? c.f : (c.v != null ? c.v : '');
      return String(v).trim();
    });
    while (cells.length && cells[cells.length - 1] === '') cells.pop();
    out.push(cells);
  }
  return out;
}

const DATE_RE = /^\d{1,2}\/\d{1,2}(\/\d{2,4})?$/;
const DAY_RE = /^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\b/i;
const SECTION_RE = /^(WARM[-\s]?UP|STRENGTH BLOCK|CONDITIONING|MOBILITY|COOL[-\s]?DOWN|CORE|ACCESSORY|MAIN|SECONDARY)\b/i;
const FINISHER_RE = /^FINISHER\b/i;
const SESSION_TAG_RE = /\(\s*(\d{1,2}(?::\d{2})?\s*(?:am|pm)?)\s*\)/i;

function parseClientName(raw) {
  if (!raw) return { name: '', session: null };
  const m = raw.match(SESSION_TAG_RE);
  if (m) {
    const session = m[1].replace(/\s+/g, '').toLowerCase();
    const name = raw.replace(SESSION_TAG_RE, '').trim();
    return { name, session };
  }
  return { name: raw, session: null };
}

function parseWorkouts(rows) {
  const workouts = [];
  let cur = null;

  function commitSection(w) {
    if (w._section) {
      if (w._section.type === 'strength' && w._section.clients) {
        w._section.clients = w._section.clients.map(parseClientName);
      }
      w.sections.push(w._section);
      w._section = null;
    }
  }
  function commit() {
    if (cur) { commitSection(cur); workouts.push(cur); cur = null; }
  }

  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const a = (row[0] || '').trim();
    if (!a && row.every(c => !c)) continue;

    if (DATE_RE.test(a)) {
      commit();
      cur = { date: a, day: '', sections: [], _section: null };
      continue;
    }

    if (!cur) {
      cur = { date: '', day: '', sections: [], _section: null };
    }

    if (!cur.day && (DAY_RE.test(a) || a.includes('—') || a.includes('–'))) {
      cur.day = a;
      continue;
    }

    if (FINISHER_RE.test(a)) {
      commitSection(cur);
      const text = a.replace(/^FINISHER\s*[:\-—]?\s*/i, '').trim();
      cur._section = { type: 'finisher', title: 'Finisher', body: text };
      commitSection(cur);
      continue;
    }

    if (SECTION_RE.test(a) || (a === a.toUpperCase() && a.length > 3 && row.slice(1).every(c => !c))) {
      commitSection(cur);
      const m = a.match(/^([A-Z][A-Z\s\-]+?)(?:\s*[—–\-]\s*(.+))?$/);
      const title = (m && m[1] ? m[1] : a).trim();
      const subtitle = (m && m[2] ? m[2] : '').trim();
      cur._section = {
        type: SECTION_RE.test(a) && /STRENGTH|MAIN|ACCESSORY|SECONDARY/i.test(title) ? 'strength' : 'list',
        title,
        subtitle,
        clients: null,
        rows: [],
      };
      continue;
    }

    if (!cur._section) {
      cur._section = { type: 'list', title: '', subtitle: '', clients: null, rows: [] };
    }

    const sec = cur._section;
    if (sec.type === 'strength' && sec.clients == null && !a && row.slice(1).some(c => c)) {
      sec.clients = row.slice(1).map(c => c.trim());
      continue;
    }

    sec.rows.push({ name: a, notes: row.slice(1).map(c => (c || '').trim()) });
  }
  commit();
  return workouts.filter(w => w.sections.length || w.day);
}

function sessionsFromWorkout(w) {
  const set = new Set();
  for (const sec of w.sections) {
    if (sec.type === 'strength' && sec.clients) {
      for (const c of sec.clients) {
        if (c.session) set.add(c.session);
      }
    }
  }
  return Array.from(set);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function renderDateNav() {
  const nav = document.getElementById('date-nav');
  nav.innerHTML = '';
  workouts.forEach((w, i) => {
    const btn = el('button',
      'shrink-0 px-4 py-2 rounded-full border text-xs eyebrow transition ' +
      (i === activeIndex
        ? 'bg-ink text-paper border-ink'
        : 'bg-transparent text-muted border-line hover:text-ink hover:border-ink/40'),
      w.date || '—'
    );
    btn.onclick = () => { activeIndex = i; activeSession = null; render(); };
    nav.appendChild(btn);
  });
}

function renderSessionNav(sessions) {
  const nav = document.getElementById('session-nav');
  nav.innerHTML = '';
  if (sessions.length === 0) return;

  const all = el('button',
    'shrink-0 px-4 py-2 rounded-full border text-xs eyebrow transition ' +
    (activeSession === null
      ? 'bg-teal text-paper border-teal'
      : 'bg-transparent text-muted border-line hover:text-ink hover:border-ink/40'),
    'All Sessions'
  );
  all.onclick = () => { activeSession = null; render(); };
  nav.appendChild(all);

  sessions.forEach(s => {
    const btn = el('button',
      'shrink-0 px-4 py-2 rounded-full border text-xs eyebrow transition ' +
      (activeSession === s
        ? 'bg-teal text-paper border-teal'
        : 'bg-transparent text-muted border-line hover:text-ink hover:border-ink/40'),
      s
    );
    btn.onclick = () => { activeSession = s; render(); };
    nav.appendChild(btn);
  });
}

function renderSectionHeader(title, subtitle) {
  const wrap = el('div', 'mb-5');
  wrap.appendChild(el('div', 'eyebrow text-teal mb-1', title));
  if (subtitle) {
    wrap.appendChild(el('div', 'text-muted text-xs font-light tracking-wide', subtitle));
  }
  return wrap;
}

function renderListSection(sec) {
  const wrap = el('section', 'mb-12');
  if (sec.title) wrap.appendChild(renderSectionHeader(sec.title, sec.subtitle));
  const list = el('ul', 'border-t hairline');
  sec.rows.forEach((r, idx) => {
    const li = el('li', 'flex items-baseline gap-4 py-3 ' + (idx < sec.rows.length - 1 ? 'border-b hairline' : ''));
    const dot = el('span', 'text-teal text-xs', '◆');
    const name = el('span', 'display text-xl md:text-2xl text-ink leading-snug', r.name);
    li.appendChild(dot); li.appendChild(name);
    list.appendChild(li);
  });
  wrap.appendChild(list);
  return wrap;
}

function renderStrengthSection(sec) {
  const wrap = el('section', 'mb-16');
  wrap.appendChild(renderSectionHeader(sec.title, sec.subtitle));

  const allClients = sec.clients || [];
  const visibleIdx = allClients
    .map((c, i) => ({ c, i }))
    .filter(({ c }) => activeSession === null || c.session === activeSession);
  const visibleClients = visibleIdx.map(v => v.c);

  if (visibleClients.length === 0 && allClients.length > 0) {
    const empty = el('div', 'border-t hairline pt-8 text-muted text-sm', 'No clients in this session for this block.');
    wrap.appendChild(empty);
    return wrap;
  }

  const grid = el('div', 'border-t hairline');
  const colCount = Math.max(visibleClients.length, 1);

  if (visibleClients.length) {
    const head = el('div', 'grid items-end gap-6 py-4 border-b hairline');
    head.style.gridTemplateColumns = `minmax(200px, 1.4fr) repeat(${colCount}, minmax(130px, 1fr))`;
    head.appendChild(el('div', 'eyebrow text-muted', 'Movement'));
    visibleClients.forEach(c => {
      const cell = el('div', '');
      cell.appendChild(el('div', 'eyebrow text-ink', c.name));
      if (c.session) cell.appendChild(el('div', 'text-teal text-[10px] tracking-widest mt-1', c.session));
      head.appendChild(cell);
    });
    grid.appendChild(head);
  }

  sec.rows.forEach((r, idx) => {
    const row = el('div', 'grid items-baseline gap-6 py-3.5 ' + (idx < sec.rows.length - 1 ? 'border-b hairline' : ''));
    row.style.gridTemplateColumns = `minmax(200px, 1.4fr) repeat(${colCount}, minmax(130px, 1fr))`;
    row.appendChild(el('div', 'display text-xl md:text-2xl text-ink leading-snug', r.name));

    const indices = visibleIdx.length ? visibleIdx.map(v => v.i) : [...Array(Math.max(r.notes.length, 1)).keys()];
    indices.forEach(i => {
      const note = (r.notes[i] || '').trim();
      const cell = el('div', 'text-ink/80 text-sm font-light leading-snug whitespace-pre-line');
      if (note) {
        cell.textContent = note;
      } else {
        cell.appendChild(el('span', 'text-muted/40', '—'));
      }
      row.appendChild(cell);
    });
    grid.appendChild(row);
  });

  wrap.appendChild(grid);
  return wrap;
}

function renderFinisher(sec) {
  const wrap = el('section', 'mt-12 mb-8 rounded-xl border border-teal/40 bg-teal/5 p-7 text-center');
  wrap.appendChild(el('div', 'eyebrow text-teal mb-3', 'Finisher'));
  wrap.appendChild(el('div', 'display text-2xl md:text-3xl text-ink leading-snug', sec.body || ''));
  return wrap;
}

function render() {
  renderDateNav();
  const root = document.getElementById('content');
  root.innerHTML = '';
  root.classList.remove('fade-in'); void root.offsetWidth; root.classList.add('fade-in');

  const w = workouts[activeIndex];
  if (!w) {
    document.getElementById('session-nav').innerHTML = '';
    root.appendChild(el('div', 'text-muted py-16 text-center', 'Loading…'));
    return;
  }

  const sessions = sessionsFromWorkout(w);
  if (activeSession && !sessions.includes(activeSession)) activeSession = null;
  renderSessionNav(sessions);

  const title = el('div', 'mb-10');
  if (w.day) title.appendChild(el('div', 'eyebrow text-muted mb-2', w.day));
  title.appendChild(el('h1', 'display text-5xl md:text-6xl text-ink leading-none', w.date || ''));
  root.appendChild(title);

  w.sections.forEach(sec => {
    if (sec.type === 'finisher') root.appendChild(renderFinisher(sec));
    else if (sec.type === 'strength') root.appendChild(renderStrengthSection(sec));
    else root.appendChild(renderListSection(sec));
  });

  document.getElementById('last-updated').textContent =
    'Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

async function tick() {
  try {
    const data = await fetchSheet();
    const sig = data.sig || JSON.stringify(data.table.rows).length;
    if (sig !== lastSig) {
      lastSig = sig;
      const rows = rowsFromData(data);
      workouts = parseWorkouts(rows);
      if (activeIndex >= workouts.length) activeIndex = 0;
      render();
    }
    document.getElementById('status').textContent = 'Live';
  } catch (e) {
    console.error(e);
    document.getElementById('status').textContent = 'Reconnecting';
  }
}

tick();
setInterval(tick, REFRESH_MS);
</script>
</body>
</html>
