<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resilient Body — Workout</title>
<link rel="icon" type="image/x-icon" href="https://images.squarespace-cdn.com/content/v1/5fdcfb6c60f802052c68ecca/1276f51a-25ac-4f31-b89d-c0eede836659/favicon.ico" />
<meta name="description" content="Live workout display for Resilient Body training sessions." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', '"Helvetica Neue"', 'Helvetica', 'Arial', 'sans-serif'],
          serif: ['"Cormorant Garamond"', 'Kepler', 'Georgia', 'serif'],
        },
        colors: {
          ink: '#000000',
          coal: '#0e0e0e',
          char: '#161616',
          line: '#2a2a2a',
          muted: '#a0a0a0',
          paper: '#f4f3ef',
          teal: '#218496',
          tealSoft: '#3aafc2',
        },
      },
    },
  };
</script>
<style>
  html, body { background: #0e0e0e; color: #f4f3ef; }
  body { font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 300; -webkit-font-smoothing: antialiased; }
  .display { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300; letter-spacing: -0.005em; }
  .eyebrow { letter-spacing: 0.34em; text-transform: uppercase; font-weight: 400; font-size: 0.72rem; }
  .hairline { border-color: #2a2a2a; }
  .scroll-x { scrollbar-width: none; }
  .scroll-x::-webkit-scrollbar { display: none; }
  .live-dot {
    width: 7px; height: 7px; border-radius: 999px; background: #218496;
    box-shadow: 0 0 0 0 rgba(33, 132, 150, 0.6); animation: pulse 2.4s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(33, 132, 150, 0.55); }
    70% { box-shadow: 0 0 0 9px rgba(33, 132, 150, 0); }
    100% { box-shadow: 0 0 0 0 rgba(33, 132, 150, 0); }
  }
  .fade-in { animation: fade 0.3s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .tab-underline { position: relative; }
  .tab-underline.active::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
    height: 2px; background: #218496;
  }
</style>
</head>
<body class="min-h-screen">

<!-- Brand hero band -->
<div class="border-b hairline">
  <div class="max-w-[1400px] mx-auto px-8 lg:px-14 py-7 flex items-center justify-between">
    <a href="https://www.resilientbody.us/" target="_blank" rel="noopener" class="flex items-center gap-5">
      <img src="https://images.squarespace-cdn.com/content/v1/5fdcfb6c60f802052c68ecca/68c84c43-5fc9-42e0-bacc-25f22d102342/Resilient_Body_Branding_Stacked_Logo_White.png?format=300w"
           alt="Resilient Body"
           class="h-14 md:h-16 w-auto" />
      <span class="hidden sm:block eyebrow text-paper/70 border-l border-paper/20 pl-5">Intelligent, individualized strength</span>
    </a>
    <div class="flex items-center gap-3 text-paper/70 text-xs">
      <span class="live-dot"></span>
      <span class="eyebrow" id="status">Live</span>
    </div>
  </div>
</div>

<div id="app" class="max-w-[1400px] mx-auto px-8 lg:px-14 py-10">

  <!-- Sheet tabs (sessions) -->
  <nav id="sheet-nav" class="flex gap-7 overflow-x-auto scroll-x mb-8 border-b hairline"></nav>

  <!-- Date pills within current sheet -->
  <nav id="date-nav" class="flex gap-2 overflow-x-auto scroll-x mb-10 pb-1"></nav>

  <main id="content" class="fade-in"></main>

  <footer class="mt-24 pt-8 border-t hairline flex items-center justify-between text-muted text-xs">
    <span class="eyebrow">Resilient Body · 2025</span>
    <span id="last-updated"></span>
  </footer>
</div>

<script>
const SHEET_ID = '1G09-JKOTXbV6l-fK0TCjnIjEMr7bq-iuAiiQ_3Hgv-s';
const SHEET_REFRESH_MS = 2000;     // refresh active sheet's data
const TAB_REFRESH_MS = 20000;      // re-discover sheet list

let sheets = [];                   // [{name, gid}, ...]
let activeGid = null;
let activeWorkoutIdx = 0;
let workouts = [];
let lastSig = null;

// ---------- DISCOVERY: pair sheet names (xlsx) with gids (htmlview), both in tab order ----------
async function fetchSheetList() {
  const stamp = Date.now();
  const [xlsxRes, htmlRes] = await Promise.all([
    fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=xlsx&_=${stamp}`, { cache: 'no-store' }),
    fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/htmlview?_=${stamp}`, { cache: 'no-store' }),
  ]);
  if (!xlsxRes.ok || !htmlRes.ok) throw new Error('discovery fetch failed');

  // Names from xlsx (in tab order)
  const buf = await xlsxRes.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);
  const xml = await zip.file('xl/workbook.xml').async('string');
  const names = [];
  const re = /<sheet [^/]*name="([^"]+)"/g;
  let m;
  while ((m = re.exec(xml))) names.push(m[1].trim());

  // Gids from htmlview (unique, in document order = tab order)
  const html = await htmlRes.text();
  const seen = new Set();
  const gids = [];
  for (const match of html.matchAll(/gid=(\d+)/g)) {
    const g = match[1];
    if (!seen.has(g)) { seen.add(g); gids.push(g); }
  }

  // Zip by index, fall back gracefully
  const n = Math.min(names.length, gids.length);
  const out = [];
  for (let i = 0; i < n; i++) out.push({ name: names[i], gid: gids[i] });
  return out;
}

// ---------- DATA: gviz fetch by gid ----------
async function fetchSheetData(gid) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${gid}&_=${Date.now()}`;
  const res = await fetch(url, { cache: 'no-store' });
  const text = await res.text();
  const match = text.match(/setResponse\(([\s\S]*)\);?\s*$/);
  if (!match) throw new Error('Bad gviz response');
  return JSON.parse(match[1]);
}

function rowsFromData(data) {
  const out = [];
  for (const r of (data.table.rows || [])) {
    const cells = (r.c || []).map(c => {
      if (!c) return '';
      const v = c.f != null ? c.f : (c.v != null ? c.v : '');
      return String(v).trim();
    });
    while (cells.length && cells[cells.length - 1] === '') cells.pop();
    out.push(cells);
  }
  return out;
}

// ---------- PARSE: workouts from rows ----------
const DATE_RE = /^\d{1,2}\/\d{1,2}(\/\d{2,4})?$/;
const DAY_RE = /^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\b/i;
const SECTION_RE = /^(WARM[-\s]?UP|STRENGTH BLOCK|CONDITIONING|MOBILITY|COOL[-\s]?DOWN|CORE|ACCESSORY|MAIN|SECONDARY)\b/i;
const FINISHER_RE = /^FINISHER\b/i;

function parseWorkouts(rows) {
  const workouts = [];
  let cur = null;

  function commitSection(w) {
    if (w._section) { w.sections.push(w._section); w._section = null; }
  }
  function commit() {
    if (cur) { commitSection(cur); workouts.push(cur); cur = null; }
  }

  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const a = (row[0] || '').trim();
    if (!a && row.every(c => !c)) continue;

    if (DATE_RE.test(a)) {
      commit();
      cur = { date: a, day: '', sections: [], _section: null };
      continue;
    }

    if (!cur) cur = { date: '', day: '', sections: [], _section: null };

    if (!cur.day && (DAY_RE.test(a) || a.includes('—') || a.includes('–'))) {
      cur.day = a;
      continue;
    }

    if (FINISHER_RE.test(a)) {
      commitSection(cur);
      const text = a.replace(/^FINISHER\s*[:\-—]?\s*/i, '').trim();
      cur._section = { type: 'finisher', title: 'Finisher', body: text };
      commitSection(cur);
      continue;
    }

    if (SECTION_RE.test(a) || (a === a.toUpperCase() && a.length > 3 && row.slice(1).every(c => !c))) {
      commitSection(cur);
      const m = a.match(/^([A-Z][A-Z\s\-]+?)(?:\s*[—–\-]\s*(.+))?$/);
      const title = (m && m[1] ? m[1] : a).trim();
      const subtitle = (m && m[2] ? m[2] : '').trim();
      cur._section = {
        type: SECTION_RE.test(a) && /STRENGTH|MAIN|ACCESSORY|SECONDARY/i.test(title) ? 'strength' : 'list',
        title, subtitle, clients: null, rows: [],
      };
      continue;
    }

    if (!cur._section) {
      cur._section = { type: 'list', title: '', subtitle: '', clients: null, rows: [] };
    }

    const sec = cur._section;
    if (sec.type === 'strength' && sec.clients == null && !a && row.slice(1).some(c => c)) {
      sec.clients = row.slice(1).map(c => c.trim());
      continue;
    }
    sec.rows.push({ name: a, notes: row.slice(1).map(c => (c || '').trim()) });
  }
  commit();
  return workouts.filter(w => w.sections.length || w.day);
}

// ---------- RENDER ----------
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function renderSheetNav() {
  const nav = document.getElementById('sheet-nav');
  nav.innerHTML = '';
  sheets.forEach(s => {
    const btn = el('button',
      'shrink-0 pb-3 pt-1 text-xs eyebrow tab-underline transition ' +
      (s.gid === activeGid ? 'text-paper active' : 'text-muted hover:text-paper'),
      s.name
    );
    btn.onclick = () => {
      if (activeGid === s.gid) return;
      activeGid = s.gid;
      activeWorkoutIdx = 0;
      lastSig = null;
      workouts = [];
      render();
      tickData();
    };
    nav.appendChild(btn);
  });
}

function renderDateNav() {
  const nav = document.getElementById('date-nav');
  nav.innerHTML = '';
  if (workouts.length <= 1) return;
  workouts.forEach((w, i) => {
    const btn = el('button',
      'shrink-0 px-4 py-2 rounded-full border text-xs eyebrow transition ' +
      (i === activeWorkoutIdx
        ? 'bg-paper text-ink border-paper'
        : 'bg-transparent text-muted border-line hover:text-paper hover:border-paper/40'),
      w.date || '—'
    );
    btn.onclick = () => { activeWorkoutIdx = i; render(); };
    nav.appendChild(btn);
  });
}

function renderSectionHeader(title, subtitle) {
  const wrap = el('div', 'mb-5');
  wrap.appendChild(el('div', 'eyebrow text-tealSoft mb-1', title));
  if (subtitle) wrap.appendChild(el('div', 'text-muted text-xs font-light tracking-wide', subtitle));
  return wrap;
}

function renderListSection(sec) {
  const wrap = el('section', 'mb-12');
  if (sec.title) wrap.appendChild(renderSectionHeader(sec.title, sec.subtitle));
  const list = el('ul', 'border-t hairline');
  sec.rows.forEach((r, idx) => {
    const li = el('li', 'flex items-baseline gap-4 py-3.5 ' + (idx < sec.rows.length - 1 ? 'border-b hairline' : ''));
    li.appendChild(el('span', 'text-tealSoft text-xs', '◆'));
    li.appendChild(el('span', 'display text-xl md:text-2xl text-paper leading-snug', r.name));
    list.appendChild(li);
  });
  wrap.appendChild(list);
  return wrap;
}

function renderStrengthSection(sec) {
  const wrap = el('section', 'mb-12');
  wrap.appendChild(renderSectionHeader(sec.title, sec.subtitle));

  const clients = sec.clients || [];
  const grid = el('div', 'border-t hairline');
  const colCount = Math.max(clients.length, 1);

  if (clients.length) {
    const head = el('div', 'grid items-end gap-6 py-4 border-b hairline');
    head.style.gridTemplateColumns = `minmax(200px, 1.4fr) repeat(${colCount}, minmax(130px, 1fr))`;
    head.appendChild(el('div', 'eyebrow text-muted', 'Movement'));
    clients.forEach(c => head.appendChild(el('div', 'eyebrow text-paper', c)));
    grid.appendChild(head);
  }

  sec.rows.forEach((r, idx) => {
    const row = el('div', 'grid items-baseline gap-6 py-4 ' + (idx < sec.rows.length - 1 ? 'border-b hairline' : ''));
    row.style.gridTemplateColumns = `minmax(200px, 1.4fr) repeat(${colCount}, minmax(130px, 1fr))`;
    row.appendChild(el('div', 'display text-xl md:text-2xl text-paper leading-snug', r.name));
    for (let i = 0; i < colCount; i++) {
      const note = (r.notes[i] || '').trim();
      const cell = el('div', 'text-paper/90 text-sm font-light leading-snug whitespace-pre-line');
      if (note) cell.textContent = note;
      else cell.appendChild(el('span', 'text-muted/40', '—'));
      row.appendChild(cell);
    }
    grid.appendChild(row);
  });

  wrap.appendChild(grid);
  return wrap;
}

function renderFinisher(sec) {
  const wrap = el('section', 'mt-12 mb-8 rounded-xl border border-teal/50 bg-teal/10 p-7 text-center');
  wrap.appendChild(el('div', 'eyebrow text-tealSoft mb-3', 'Finisher'));
  wrap.appendChild(el('div', 'display text-2xl md:text-3xl text-paper leading-snug', sec.body || ''));
  return wrap;
}

function render() {
  renderSheetNav();
  renderDateNav();
  const root = document.getElementById('content');
  root.innerHTML = '';
  root.classList.remove('fade-in'); void root.offsetWidth; root.classList.add('fade-in');

  if (!activeGid && activeGid !== '0') {
    root.appendChild(el('div', 'text-muted py-16 text-center text-sm', 'Loading sessions…'));
    return;
  }

  const w = workouts[activeWorkoutIdx];
  if (!w) {
    root.appendChild(el('div', 'text-muted py-16 text-center text-sm', 'Loading workout…'));
    return;
  }

  const activeSheet = sheets.find(s => s.gid === activeGid);
  const title = el('div', 'mb-10');
  if (w.day) title.appendChild(el('div', 'eyebrow text-muted mb-2', w.day));
  title.appendChild(el('h1', 'display text-5xl md:text-6xl text-paper leading-none', w.date || (activeSheet ? activeSheet.name : '')));
  root.appendChild(title);

  w.sections.forEach(sec => {
    if (sec.type === 'finisher') root.appendChild(renderFinisher(sec));
    else if (sec.type === 'strength') root.appendChild(renderStrengthSection(sec));
    else root.appendChild(renderListSection(sec));
  });

  document.getElementById('last-updated').textContent =
    'Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

// ---------- TICKS ----------
async function tickData() {
  if (activeGid == null) return;
  try {
    const data = await fetchSheetData(activeGid);
    const sig = data.sig || JSON.stringify(data.table.rows).length;
    if (sig !== lastSig) {
      lastSig = sig;
      const rows = rowsFromData(data);
      workouts = parseWorkouts(rows);
      if (activeWorkoutIdx >= workouts.length) activeWorkoutIdx = 0;
      render();
    }
    document.getElementById('status').textContent = 'Live';
  } catch (e) {
    console.error('tickData', e);
    document.getElementById('status').textContent = 'Reconnecting';
  }
}

async function tickTabs() {
  try {
    const list = await fetchSheetList();
    const changed = JSON.stringify(list) !== JSON.stringify(sheets);
    sheets = list;
    const stillThere = sheets.some(s => s.gid === activeGid);
    if (!stillThere) {
      activeGid = sheets[0] ? sheets[0].gid : null;
      activeWorkoutIdx = 0;
      lastSig = null;
      workouts = [];
    }
    if (changed) render();
  } catch (e) {
    console.error('tickTabs', e);
  }
}

(async () => {
  await tickTabs();
  await tickData();
  setInterval(tickData, SHEET_REFRESH_MS);
  setInterval(tickTabs, TAB_REFRESH_MS);
})();
</script>
</body>
</html>
